<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Items — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: hsl(40, 33%, 96%);
      color: hsl(30, 12%, 14%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      text-align: center;
    }
    .container { max-width: 320px; }
    .icon {
      width: 48px; height: 48px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: hsl(38, 22%, 91%);
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 22px; height: 22px; stroke: hsl(30, 8%, 50%); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: hsl(30, 8%, 50%);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 0.875rem;
      padding: 0.625rem 1.5rem;
      border-radius: 0.75rem;
      border: 1px solid hsl(35, 16%, 89%);
      background: transparent;
      color: hsl(30, 12%, 14%);
      cursor: pointer;
    }
    button:active { background: hsl(38, 22%, 91%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Items needs an internet connection to load today's prompt and the collective feed. Reconnect and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
